<!-- satisfactionCard.html — Career satisfaction score display -->
<div class="card" style="text-align:center">
    <div class="card-title">Career Satisfaction Score</div>
    <div style="font-family:'Syne',sans-serif;font-size:3rem;font-weight:800;
                color:{satColour};margin:0.5rem 0">
        {satisfactionValue}<span style="font-size:1.2rem;color:var(--muted)">/100</span>
    </div>
    <span class="sat-badge" style="background:rgba(0,0,0,0.3);
          border:1px solid {satColour};color:{satColour}">
        {satText}
    </span>
</div>
